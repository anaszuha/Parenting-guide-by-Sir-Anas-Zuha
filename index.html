<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parenting Guide</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Parenting Guide by Sir Anas Zuha</h1>

    <div class="profile-box">

      <h2>Child Profile</h2>

      <input type="number" id="age" placeholder="Enter Child Age">

      <select id="gender">
        <option value="boy">Boy</option>
        <option value="girl">Girl</option>
      </select>

      <select id="region">
        <option value="asian">Asian Culture</option>
        <option value="western">Western Culture</option>
        <option value="middle_east">Middle East Culture</option>
        <option value="african">African Culture</option>
      </select>

    </div>


    <div class="problem-box">

      <h2>Problem / Goal</h2>

      <textarea id="inputBox" placeholder="
Examples:

child gets bad marks
child lies frequently
child is bullied
improve confidence
mobile addiction
child is aggressive
improve english speaking
"></textarea>

      <button onclick="handleInput()">Analyze</button>

    </div>


    <div id="output"></div>

  </div>

  <script src="rules.js"></script>
  <script src="script.js"></script>

</body>

</html>
